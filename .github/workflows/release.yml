name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack plugin archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=rime.vim/ \
            -o "dist/rime.vim-${GITHUB_REF_NAME}.zip" HEAD
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
